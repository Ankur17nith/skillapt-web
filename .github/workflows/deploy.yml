name: Deploy to Cloudflare

# Deploys the static site with Cloudflare Workers static assets (free plan).
# Runs on every push to main, but only when CLOUDFLARE_API_TOKEN is configured.
# Alternatively skip this workflow and connect the repo in the Cloudflare
# dashboard (Workers & Pages -> Create -> Import a repository); see README.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Job-level so the step-level `if` conditions can read it.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      - name: Build
        run: npm run build
        env:
          VITE_REGISTRY_URL: ${{ vars.VITE_REGISTRY_URL }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}

      - name: Deploy to Cloudflare Workers (static assets)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Note skipped deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "::notice ::CLOUDFLARE_API_TOKEN is not set; build succeeded but deployment was skipped."
